<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR & EVC Metering Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #0056b3;
            --danger: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
            --info: #17a2b8;
            --text-dark: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .voltage-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 15px 0;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
        }
        .status-safe { background-color: var(--success); }
        .status-warning { background-color: var(--danger); }
        
        .device-state-box {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
        }
        
        .device-state-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            color: white;
            background-color: var(--success); /* Default ON */
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 5px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-primary { background-color: var(--primary); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: #ff9800; }
        
        .log-box {
            margin-top: 15px;
            padding: 10px;
            background: #eee;
            border-radius: 5px;
            font-family: monospace;
            text-align: left;
            height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sistem Monitoring AMR & EVC</h2>
        <p>Dashboard Pemantauan Voltase & Kontrol Remote (miniELCOR 2011-2015)</p>
    </div>

    <div class="dashboard-container">
        <!-- Card 1: Deteksi Voltase Battery -->
        <div class="card">
            <h3>Deteksi Voltase Battery EVC</h3>
            <div class="voltage-display" id="voltageValue">3.60 V</div>
            <div id="voltageStatus" class="status-badge status-safe">Aman (Normal)</div>
            <p style="font-size: 12px; color: #666; margin-top: 15px;">
                *Peringatan akan muncul jika voltase mencapai 3.20 VDC
            </p>
            <button class="btn btn-primary" onclick="fetchVoltageData()">Refresh Data</button>
        </div>

        <!-- Card 2: Auto Restart Command -->
        <div class="card">
            <h3>Terminal Kontrol Jarak Jauh</h3>
            
            <!-- PANEL STATUS PERANGKAT BARU -->
            <div class="device-state-box">
                <div style="font-size: 0.9rem; color: #555;">Status EVC Saat Ini:</div>
                <div id="deviceStateText" class="device-state-text">ON (AKTIF)</div>
            </div>

            <div>
                <button class="btn btn-primary" onclick="sendCommand('ON')">ON</button>
                <button class="btn btn-danger" onclick="sendCommand('OFF')">OFF</button>
                <button class="btn btn-warning" onclick="sendCommand('RESTART')">RESTART</button>
            </div>
            
            <div class="log-box" id="commandLog">
                [Sistem] Menunggu instruksi...
            </div>
        </div>
    </div>

    <script>
        function fetchVoltageData() {
            const simulatedVoltages = [3.65, 3.40, 3.25, 3.20, 3.15];
            const randomVolt = simulatedVoltages[Math.floor(Math.random() * simulatedVoltages.length)];
            
            const voltageElem = document.getElementById('voltageValue');
            const statusElem = document.getElementById('voltageStatus');
            
            voltageElem.innerText = randomVolt.toFixed(2) + " V";
            
            if (randomVolt <= 3.20) {
                statusElem.className = "status-badge status-warning";
                statusElem.innerText = "Peringatan: Battery Low!";
                addLog(`[Alert] Voltase EVC terdeteksi ${randomVolt.toFixed(2)}V (Threshold tercapai).`);
                
                setTimeout(() => {
                    alert("BATERAI AMR SUDAH LOW, SEGERA PETUGAS CEK KE LOKASI");
                }, 10);
                
            } else {
                statusElem.className = "status-badge status-safe";
                statusElem.innerText = "Aman (Normal)";
            }
        }

        function sendCommand(command) {
            const stateText = document.getElementById('deviceStateText');
            
            // 1. Tampilkan status "Memproses..." berwarna kuning saat tombol ditekan
            stateText.innerText = `MEMPROSES ${command}...`;
            stateText.style.backgroundColor = "var(--warning)";
            stateText.style.color = "#000"; // Teks hitam agar terbaca di background kuning

            addLog(`[Aksi] Mengirim perintah ${command} ke Arduino EVC...`);
            
            // 2. Simulasikan jeda pengiriman data jaringan (1.5 detik)
            setTimeout(() => {
                addLog(`[Status] Perangkat berhasil dieksekusi menjadi: ${command}`);
                
                // 3. Ubah indikator status sesuai perintah yang berhasil
                if (command === 'ON') {
                    stateText.innerText = "ON (AKTIF)";
                    stateText.style.backgroundColor = "var(--success)";
                    stateText.style.color = "white";
                } 
                else if (command === 'OFF') {
                    stateText.innerText = "OFF (MATI)";
                    stateText.style.backgroundColor = "var(--danger)";
                    stateText.style.color = "white";
                } 
                else if (command === 'RESTART') {
                    stateText.innerText = "BERHASIL RESTART";
                    stateText.style.backgroundColor = "var(--info)"; // Warna biru muda
                    stateText.style.color = "white";
                    
                    // Jika restart, setelah 3 detik status kembali menjadi ON
                    setTimeout(() => {
                        stateText.innerText = "ON (AKTIF)";
                        stateText.style.backgroundColor = "var(--success)";
                    }, 3000);
                }
            }, 1500); // Waktu delay simulasi balasan dari Arduino
        }

        function addLog(message) {
            const logBox = document.getElementById('commandLog');
            const time = new Date().toLocaleTimeString('id-ID');
            logBox.innerHTML = `<div>${time} - ${message}</div>` + logBox.innerHTML;
        }
    </script>
</body>
</html>
